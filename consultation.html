<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Book a Consultation | EduAdvance</title>

<link rel="stylesheet" href="css/consultation.css">
</head>

<body>

<header class="site-header">
    <div class="container navbar">

        <a class="brand" href="index.html">
            <img src="images/logo.png" alt="EduAdvance">
            <span>EduAdvance</span>
        </a>

        <a class="back-link" href="index.html">← Back to Home</a>

    </div>
</header>

<section class="consultation-hero">

<div class="container consultation-layout">

<div class="consultation-copy">

<p class="eyebrow">Consultation</p>

<h1>Book a Consultation</h1>

<p>
Tell us about your school, your priorities and the support you require.
Our team will review your enquiry and contact you to arrange a suitable consultation.
</p>

<div class="contact-details">
<strong>Email</strong><br>

<a href="https://mail.google.com/mail/u/0/?fs=1&tf=cm&to=consultation@eduadvance.uk&su=Consultation"
target="_blank">
consultation@eduadvance.uk
</a>

</div>

</div>

<form class="consultation-form"
action="https://formsubmit.co/consultation@eduadvance.uk"
method="POST">

<input type="hidden" name="_captcha" value="false">

<label>Your Name</label>
<input type="text" name="name" required>

<label>School</label>
<input type="text" name="school" required>

<label>Email</label>
<input type="email" name="email" required>

<label>Region</label>

<select name="region">
<option>United Kingdom</option>
<option>Canada</option>
<option>United States</option>
<option>Egypt</option>
<option>Gulf States</option>
<option>Other</option>
</select>

<label>Tell us about your school</label>

<textarea name="message" rows="7"></textarea>

<button type="submit">Send Consultation Request</button>

</form>

</div>

</section>

</body>
</html>
